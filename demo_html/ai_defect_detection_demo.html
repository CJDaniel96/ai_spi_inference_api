<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Defect Detection Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 40px;
            color: white;
        }
        
        .header h1 {
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }
        
        .demo-controls {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .controls-row {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .btn {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }
        
        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        
        .progress-bar {
            width: 100%;
            height: 8px;
            background: #f0f0f0;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 20px;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            width: 0%;
            transition: width 0.3s ease;
        }
        
        .animation-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 40px 0;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        
        .images-queue {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }
        
        .queue-image {
            width: 80px;
            height: 60px;
            object-fit: cover;
            border-radius: 8px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.2);
            transition: all 0.5s ease;
            cursor: pointer;
        }
        
        .queue-image.flying {
            transform: translateX(400px) scale(1.5);
            z-index: 10;
        }
        
        .ai-processor {
            width: 150px;
            height: 150px;
            border: 3px dashed #667eea;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            position: relative;
            overflow: hidden;
        }
        
        .ai-processor.thinking {
            animation: pulse 0.8s ease-in-out infinite;
        }
        
        .ai-icon {
            width: 60px;
            height: 60px;
            margin-bottom: 5px;
        }
        
        .thinking-dots {
            display: none;
            font-size: 1.5em;
            animation: thinking 1.5s ease-in-out infinite;
        }
        
        .ai-processor.thinking .thinking-dots {
            display: block;
        }
        
        
        .processing-indicator {
            text-align: center;
            padding: 40px;
            display: none;
        }
        
        .processing-indicator.active {
            display: block;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @keyframes thinking {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
        
        .statistics {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-top: 30px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        
        .stat-item {
            display: inline-block;
            margin: 0 30px;
        }
        
        .stat-number {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
            display: block;
        }
        
        .stat-label {
            color: #666;
            margin-top: 5px;
        }
        
        /* Modal styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.8);
        }
        
        .modal-content {
            position: relative;
            margin: 5% auto;
            width: 90%;
            max-width: 800px;
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }
        
        .modal-title {
            color: #667eea;
            font-size: 1.5em;
            font-weight: bold;
        }
        
        .close-btn {
            background: #ff4757;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        
        .close-btn:hover {
            background: #ff3838;
            transform: scale(1.05);
        }
        
        .predict-image {
            width: 100%;
            max-height: 500px;
            object-fit: contain;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 AI Defect Detection Demo</h1>
            <p>Real-time image analysis for manufacturing quality control</p>
        </div>
        
        <div class="demo-controls">
            <div class="controls-row">
                <button class="btn" id="startDemo">Start Demo</button>
                <button class="btn" id="pauseDemo" disabled>Pause</button>
                <button class="btn" id="resetDemo">Reset</button>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>
        
        <div class="animation-container">
            <div class="images-queue" id="imagesQueue">
                <h3 style="margin-bottom: 20px; color: #667eea;">Image Queue</h3>
                <!-- Images will be loaded here -->
            </div>
            
            <div class="ai-processor" id="aiProcessor">
                <img src="./static/AI_brain.png" alt="AI Brain" class="ai-icon">
                <div>AI Brain</div>
                <div class="thinking-dots">...</div>
            </div>
            
            <div style="text-align: center;">
                <h3 style="color: #667eea; margin-bottom: 10px;">Processing Results</h3>
                <div id="currentResult" style="font-size: 1.1em; color: #666;">Waiting for images...</div>
            </div>
        </div>
        
        
        <div class="statistics">
            <div class="stat-item">
                <span class="stat-number" id="totalImages">0</span>
                <div class="stat-label">Images Processed</div>
            </div>
            <div class="stat-item">
                <span class="stat-number" id="defectsFound">0</span>
                <div class="stat-label">Defects Detected</div>
            </div>
            <div class="stat-item">
                <span class="stat-number" id="avgConfidence">0%</span>
                <div class="stat-label">Average Confidence</div>
            </div>
        </div>
    </div>
    
    <!-- Modal for predict images -->
    <div id="predictModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">AI Prediction Result</div>
                <button class="close-btn" onclick="closePredictModal()">Close</button>
            </div>
            <div id="modalImageContainer">
                <img id="modalPredictImage" class="predict-image" src="" alt="AI Prediction">
            </div>
        </div>
    </div>
    
    <script>
        // Defect data using actual images
        const defectImages = [
            {
                id: 1,
                name: "錫覆蓋率低",
                image: "./image/3_1080.jpg",
                predictImage: "./image/3_1080_predict.jpg",
                confidence: 94.2,
                description: "Low tin coverage detected on solder pad"
            },
            {
                id: 2,
                name: "外來物", 
                image: "./image/7_259.jpg",
                predictImage: "./image/7_259_predict.png",
                confidence: 87.6,
                description: "Foreign material contamination detected"
            },
            {
                id: 3,
                name: "外來物",
                image: "./image/15_173.jpg",
                predictImage: "./image/15_173_predict.png",
                confidence: 91.3,
                description: "Foreign material contamination detected"
            },
            {
                id: 4,
                name: "錫覆蓋率高",
                image: "./image/19_3547.jpg",
                predictImage: "./image/19_3547_predict.jpg",
                confidence: 96.8,
                description: "High tin coverage detected on solder pad"
            },
            {
                id: 5,
                name: "中間焊盤過度覆蓋 & 間距過小",
                image: "./image/19_3663.jpg",
                predictImage: "./image/19_3663_predict.png",
                confidence: 89.4,
                description: "Excessive middle pad coverage and insufficient spacing"
            }
        ];
        
        let currentIndex = 0;
        let isRunning = false;
        let processingTimeout;
        let totalProcessed = 0;
        let totalDefects = 0;
        let totalConfidence = 0;
        
        const startBtn = document.getElementById('startDemo');
        const pauseBtn = document.getElementById('pauseDemo');
        const resetBtn = document.getElementById('resetDemo');
        const progressFill = document.getElementById('progressFill');
        const imagesQueue = document.getElementById('imagesQueue');
        const aiProcessor = document.getElementById('aiProcessor');
        const currentResult = document.getElementById('currentResult');
        
        startBtn.addEventListener('click', startDemo);
        pauseBtn.addEventListener('click', pauseDemo);
        resetBtn.addEventListener('click', resetDemo);
        
        // Initialize the demo
        function initializeDemo() {
            loadImageQueue();
        }
        
        function loadImageQueue() {
            // Clear existing images
            const existingImages = imagesQueue.querySelectorAll('.queue-image');
            existingImages.forEach(img => img.remove());
            
            // Add images to queue
            defectImages.forEach((defect, index) => {
                const img = document.createElement('img');
                img.src = defect.image;
                img.className = 'queue-image';
                img.dataset.index = index;
                img.alt = defect.name;
                imagesQueue.appendChild(img);
            });
        }
        
        function startDemo() {
            isRunning = true;
            startBtn.disabled = true;
            pauseBtn.disabled = false;
            currentResult.textContent = "Starting analysis...";
            processNextImage();
        }
        
        function pauseDemo() {
            isRunning = false;
            startBtn.disabled = false;
            pauseBtn.disabled = true;
            if (processingTimeout) {
                clearTimeout(processingTimeout);
            }
        }
        
        function resetDemo() {
            isRunning = false;
            currentIndex = 0;
            totalProcessed = 0;
            totalDefects = 0;
            totalConfidence = 0;
            
            startBtn.disabled = false;
            pauseBtn.disabled = true;
            
            progressFill.style.width = '0%';
            aiProcessor.classList.remove('thinking');
            currentResult.textContent = "Waiting for images...";
            
            // Reset all images to original position
            const queueImages = imagesQueue.querySelectorAll('.queue-image');
            queueImages.forEach(img => {
                img.classList.remove('flying');
                img.style.opacity = '1';
            });
            
            updateStatistics();
            loadImageQueue();
            
            if (processingTimeout) {
                clearTimeout(processingTimeout);
            }
        }
        
        function processNextImage() {
            if (!isRunning || currentIndex >= defectImages.length) {
                if (currentIndex >= defectImages.length) {
                    completeDemo();
                }
                return;
            }
            
            const defect = defectImages[currentIndex];
            const currentImg = imagesQueue.querySelector(`[data-index="${currentIndex}"]`);
            
            if (!currentImg) {
                currentIndex++;
                processNextImage();
                return;
            }
            
            // Step 1: Animate image flying to AI processor
            currentResult.textContent = `Flying image ${currentIndex + 1} to AI processor...`;
            currentImg.classList.add('flying');
            
            // Step 2: After 500ms (flying animation), start AI thinking
            setTimeout(() => {
                if (!isRunning) return;
                
                // Hide the flying image and start AI thinking
                currentImg.style.opacity = '0';
                aiProcessor.classList.add('thinking');
                currentResult.textContent = `AI is analyzing image ${currentIndex + 1}...`;
                
                // Step 3: After 2 seconds of AI thinking, show results
                processingTimeout = setTimeout(() => {
                    if (!isRunning) return;
                    
                    // Stop AI thinking animation
                    aiProcessor.classList.remove('thinking');
                    
                    currentResult.innerHTML = `<strong style="color: #ff4757;">DEFECT DETECTED!</strong><br>${defect.name} (${defect.confidence}% confidence)`;
                    
                    // Show predict image modal
                    showPredictModal(defect.predictImage, defect.name);
                    
                    // Update progress
                    currentIndex++;
                    const progress = (currentIndex / defectImages.length) * 100;
                    progressFill.style.width = progress + '%';
                    
                    // Update statistics
                    totalProcessed++;
                    totalDefects++;
                    totalConfidence += defect.confidence;
                    updateStatistics();
                    
                    // Wait for modal to be closed before processing next image
                    // The next image will be processed when modal is closed
                    
                }, 2000); // Exactly 2 seconds AI thinking time
                
            }, 500); // 500ms for flying animation
        }
        
        
        function updateStatistics() {
            document.getElementById('totalImages').textContent = totalProcessed;
            document.getElementById('defectsFound').textContent = totalDefects;
            document.getElementById('avgConfidence').textContent = 
                totalProcessed > 0 ? Math.round(totalConfidence / totalProcessed) + '%' : '0%';
        }
        
        function completeDemo() {
            isRunning = false;
            startBtn.disabled = false;
            pauseBtn.disabled = true;
            currentResult.innerHTML = `<strong style="color: #667eea;">🎉 Demo Complete!</strong><br>All images processed successfully. Click Reset to run again.`;
        }
        
        // Initialize the demo when page loads
        window.addEventListener('load', initializeDemo);
        
        // Initialize statistics
        updateStatistics();
        
        // Modal functions
        function showPredictModal(predictImageSrc, defectName) {
            const modal = document.getElementById('predictModal');
            const modalImage = document.getElementById('modalPredictImage');
            const modalTitle = document.querySelector('.modal-title');
            
            modalImage.src = predictImageSrc;
            modalTitle.textContent = `AI Prediction Result - ${defectName}`;
            modal.style.display = 'block';
        }
        
        function closePredictModal() {
            const modal = document.getElementById('predictModal');
            modal.style.display = 'none';
            
            // Continue processing next image after modal is closed
            if (currentIndex < defectImages.length && isRunning) {
                setTimeout(() => {
                    if (isRunning) {
                        processNextImage();
                    }
                }, 500);
            } else if (currentIndex >= defectImages.length) {
                completeDemo();
            }
        }
        
        // Close modal when clicking outside
        window.addEventListener('click', function(event) {
            const modal = document.getElementById('predictModal');
            if (event.target === modal) {
                closePredictModal();
            }
        });
    </script>
</body>
</html>
