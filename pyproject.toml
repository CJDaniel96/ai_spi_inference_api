[project]
name = "ai-spi-controller"
version = "0.2.0"
description = "Single-controller SPI OBB inspection with durable local recovery"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic==2.11.3",
    "pandas==2.1.4",
    "numpy==1.26.4",
    "opencv-python==4.11.0.86",
]

[project.optional-dependencies]
inference = [
    "ultralytics==8.3.187",
    "torch==2.7.1",
    "torchvision==0.22.1",
    "onnx>=1.17.0",
]
cuda = ["onnxruntime-gpu==1.19.0; sys_platform != 'darwin'"]
mac = ["onnxruntime==1.19.0"]
tensorrt-export = ["onnxslim>=0.1.59,<0.2"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6.0"]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128", marker = "(sys_platform == 'linux' and platform_machine == 'x86_64') or (sys_platform == 'win32' and platform_machine == 'AMD64')" }
torchvision = { index = "pytorch-cu128", marker = "(sys_platform == 'linux' and platform_machine == 'x86_64') or (sys_platform == 'win32' and platform_machine == 'AMD64')" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = [".venv", "tmp_artifacts", "output", "doc", "demo_html", "fan_out"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]
norecursedirs = [".venv", "tmp_artifacts", "output", "doc", "demo_html", "fan_out"]
